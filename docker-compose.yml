services:
  job-tracker:
    build: .
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in the Portainer stack environment variables}
      AI_SECRETS_KEY: ${AI_SECRETS_KEY:-}
      DATABASE_PATH: /data/jobs.db
      CANDIDATE_PROFILE_PATH: /app/.ai/nikolai_semenov_master_profile_v1.json
    ports:
      - "${BIND_IP:-127.0.0.1}:${PORT:-3000}:3000"
    volumes:
      - job-tracker-data:/data
      - ./.ai:/app/.ai:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  job-tracker-data:
