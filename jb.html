<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Pages — Daily Check</title>
<style>
  :root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--green:#3fb950;--accent:#58a6ff;--amber:#d29922}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px;max-width:1100px;margin:0 auto}
  h1{font-size:20px;margin-bottom:4px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .bar{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .progress{flex:1;min-width:200px;height:10px;background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden}
  .progress>div{height:100%;background:var(--green);width:0%;transition:.3s}
  .count{font-size:14px;color:var(--muted);white-space:nowrap}
  .count b{color:var(--green)}
  button{background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  h2{font-size:15px;margin:22px 0 10px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
  .item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:11px 14px;transition:.15s}
  .item:hover{border-color:var(--accent)}
  .item.done{border-color:var(--green);background:#1f4b2c33}
  .item.done .check{opacity:1}
  .check{width:20px;height:20px;min-width:20px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--green);opacity:.35;transition:.15s}
  .info{flex:1;min-width:0}
  .name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .note{font-size:11px;color:var(--muted);margin-top:2px}
  .tag{font-size:10px;padding:1px 7px;border-radius:9px;background:var(--amber);color:#000;font-weight:700}
  .tag.app{background:var(--green)}
  a.open{font-size:12px;color:var(--accent);text-decoration:none;white-space:nowrap;padding:5px 10px;border:1px solid var(--border);border-radius:6px}
  a.open:hover{background:#1f6feb22}
</style>
</head>
<body>
  <h1>📌 Career Pages — ежедневный обход</h1>
  <div class="sub">Клик по «↗» открывает карьерную страницу и помечает её посещённой сегодня. На следующий день счётчик обнуляется сам.</div>

  <div class="bar">
    <div class="progress"><div id="pbar"></div></div>
    <div class="count" id="count"></div>
    <button id="reset">Сбросить отметки</button>
  </div>

  <div id="app"></div>

<script>
/* ============ ДАННЫЕ (редактируй здесь) ============ */
/* done:true не нужно — статус хранится в браузере по ключу */
/* tag: "🔥" приоритет, "✅ апп" — уже есть активная заявка   */
const DATA = [
 {group:"🇩🇪 Германия", items:[
  {name:"Covestro", note:"полимеры, R&D, process", url:"https://careers.covestro.com/", tag:"🔥"},
  {name:"LANXESS", note:"engineering + R&D", url:"https://career.lanxess.com/", tag:"🔥"},
  {name:"Evonik", note:"specialty polymers", url:"https://careers.evonik.com/", tag:"🔥"},
  {name:"BASF", note:"крупнейший, много ролей", url:"https://www.basf.com/global/en/careers.html"},
  {name:"Wacker", note:"силиконы, эластомеры", url:"https://www.wacker.com/cms/en-global/about-wacker/career.html"},
  {name:"Henkel", note:"adhesives, полимеры", url:"https://www.henkel.de/karriere"},
  {name:"Arkema", note:"compounding, extrusion (FR/DE)", url:"https://jobs.arkema.com/"},
  {name:"Greiner", note:"упаковка, пенопласты", url:"https://www.greiner.com/en/career/", tag:"🔥"},
  {name:"SÜDPACK", note:"пищевая упаковка, экструзия", url:"https://www.suedpack.com/en/career", tag:"🔥"},
  {name:"Bischof+Klein", note:"гибкая упаковка", url:"https://bk-international.softgarden.io/", tag:"✅ апп"},
  {name:"KraussMaffei", note:"переработка пластмасс", url:"https://www.kraussmaffeigroup.com/en/career.html"},
  {name:"Reifenhäuser", note:"экструзионные линии", url:"https://www.reifenhauser.com/en/career"},
  {name:"Brückner", note:"пленки, растяжка", url:"https://www.brueckner.com/career"},
  {name:"Albis / Mocom", note:"компаунды, дистрибуция", url:"https://www.albis.com/en/career"}
 ]},
 {group:"🇳🇱 Нидерланды", items:[
  {name:"SABIC (Geleen)", note:"полимеры, R&D", url:"https://careers.sabic.com/", tag:"🔥"},
  {name:"DSM-Firmenich", note:"materials science", url:"https://www.dsm-firmenich.com/careers.html", tag:"🔥"},
  {name:"Avantium", note:"биополимеры, упаковка", url:"https://avantium.com/job-openings/", tag:"✅ апп"},
  {name:"TotalEnergies Corbion", note:"PLA, биопластики", url:"https://totalenergies-corbion.com/careers/", tag:"✅ апп"},
  {name:"Trinseo", note:"полимерные решения", url:"https://emeacareers-trinseo.icims.com/", tag:"✅ апп"},
  {name:"Nouryon", note:"химия, полимеры", url:"https://www.nouryon.com/careers/", tag:"✅ апп"},
  {name:"Canon Production Printing", note:"materials scientist", url:"https://jobs.cpp.canon/", tag:"✅ апп"},
  {name:"Cosun Biobased", note:"биоматериалы", url:"https://www.cosun.com/en/career/", tag:"🔥"},
  {name:"Senbis", note:"полимерные инновации", url:"https://www.senbis.nl/"}
 ]},
 {group:"🇧🇪 Бельгия", items:[
  {name:"Borealis", note:"полиолефины, упаковка", url:"https://www.borealisgroup.com/careers", tag:"🔥"},
  {name:"Syensqo", note:"specialty polymers", url:"https://careers.syensqo.com/", tag:"🔥"},
  {name:"Ravago", note:"компаунды, рециклинг", url:"https://www.ravago.com/en/careers", tag:"🔥"},
  {name:"Recticel", note:"пенополиуретаны", url:"https://www.recticel.com/en/careers"},
  {name:"Sioen", note:"технический текстиль, покрытия", url:"https://jobs.sioen.com/", tag:"✅ апп"},
  {name:"DuPont (Belgium)", note:"Tyvek, материалы", url:"https://careers.dupont.com/", tag:"✅ апп"}
 ]}
];
/* ===================================================== */

const KEY='career_visits';
let visits=JSON.parse(localStorage.getItem(KEY)||'{}');
const today=()=>new Date().toISOString().slice(0,10);

function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  let total=0, done=0;
  DATA.forEach(sec=>{
    const h=document.createElement('h2'); h.textContent=sec.group; app.appendChild(h);
    const grid=document.createElement('div'); grid.className='grid';
    sec.items.forEach(c=>{
      total++;
      const isDone=visits[c.name]===today();
      if(isDone)done++;
      const el=document.createElement('div');
      el.className='item'+(isDone?' done':'');
      el.innerHTML=`
        <div class="check">✓</div>
        <div class="info">
          <div class="name">${c.name}${c.tag?` <span class="tag ${c.tag.includes('апп')?'app':''}">${c.tag}</span>`:''}</div>
          <div class="note">${c.note||''}</div>
        </div>
        <a class="open" href="${c.url}" target="_blank" rel="noopener" data-name="${c.name}">↗ открыть</a>`;
      grid.appendChild(el);
    });
    app.appendChild(grid);
  });
  document.getElementById('count').innerHTML=`<b>${done}</b> / ${total} сегодня`;
  document.getElementById('pbar').style.width=(total?done/total*100:0)+'%';

  document.querySelectorAll('a.open').forEach(a=>{
    a.addEventListener('click',()=>{
      visits[a.dataset.name]=today();
      localStorage.setItem(KEY,JSON.stringify(visits));
      setTimeout(render,80);
    });
  });
}

document.getElementById('reset').addEventListener('click',()=>{
  visits={}; localStorage.setItem(KEY,'{}'); render();
});

render();
</script>
</body>
</html>
